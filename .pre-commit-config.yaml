repos:
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd leaderboard && npx eslint --fix .'
        language: system
        files: ^leaderboard/.*\.(js|jsx)$
        pass_filenames: false

      - id: prettier
        name: prettier
        entry: bash -c 'cd leaderboard && npx prettier --write .'
        language: system
        files: ^leaderboard/.*\.(js|jsx|css|html|json|md)$
        pass_filenames: false
