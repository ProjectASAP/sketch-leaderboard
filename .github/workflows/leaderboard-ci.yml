name: Leaderboard CI

on:
  push:
    branches: [main]
    paths: ["leaderboard/**"]
  pull_request:
    paths: ["leaderboard/**"]
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leaderboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: leaderboard/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: leaderboard-dist
          path: leaderboard/dist/

  deploy:
    needs: lint-and-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: leaderboard-dist
          path: dist/

      - name: Push to Pages repo
        env:
          SSH_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          echo "$SSH_KEY" > /tmp/deploy_key
          GIT_SSH_COMMAND="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            git clone git@github.com:ProjectASAP/ProjectASAP.github.io.git pages
          rm -rf pages/sketch-leaderboard
          cp -r dist pages/sketch-leaderboard
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sketch-leaderboard/
          git diff --staged --quiet || GIT_SSH_COMMAND="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" git commit -m "chore: update sketch-leaderboard build"
          GIT_SSH_COMMAND="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" git push
